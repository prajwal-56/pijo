<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasks - PIJO</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="logo">
        <span>●</span> PIJO
      </div>
      <nav class="nav-links">
        <a href="/" class="nav-link">Dashboard</a>
        <a href="/static/members.html" class="nav-link">Members</a>
        <a href="/static/tasks.html" class="nav-link active">Tasks</a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="page-header" style="margin-bottom: 1.5rem;">
        <div>
          <h1>Task Board</h1>
          <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;">Create, upload CSV, and let AI assign & prioritize tasks</p>
        </div>
        <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
          <input type="file" id="csv-upload" accept=".csv" style="display:none" onchange="uploadCSV(event)">
          <button class="btn" onclick="document.getElementById('csv-upload').click()">📁 Upload CSV</button>
          <button class="btn" onclick="openAddTaskModal()">➕ Add Task</button>
          <button class="btn btn-primary" id="btn-ai-assign" onclick="aiAssign(this)">🤖 AI Assign All</button>
          <button class="btn btn-primary" id="btn-ai-prioritize" onclick="aiPrioritize(this)">📊 AI Prioritize</button>
          <button class="btn btn-danger" onclick="clearAllTasks()">🗑 Clear All</button>
        </div>
      </header>

      <div class="kanban-board" id="kanban-board">
        <!-- Columns injected by JS -->
      </div>
    </main>
  </div>

  <!-- Add Task Modal -->
  <div class="modal-overlay" id="add-task-modal">
    <div class="modal-content">
      <h3 style="margin-bottom: 1rem;">Add New Task</h3>
      <form id="add-task-form" onsubmit="handleAddTask(event)">
        <div class="form-group">
          <label class="form-label">Task Title *</label>
          <input type="text" name="title" class="form-control" placeholder="e.g. Implement authentication flow" required>
        </div>
        <div class="form-group">
          <label class="form-label">Description / Requirements</label>
          <textarea name="description" class="form-control" placeholder="Details about what needs to be built..."></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Priority</label>
          <select name="priority" class="form-control">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
            <option value="critical">Critical</option>
          </select>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:0.5rem; margin-top:1.5rem;">
          <button type="button" class="btn" onclick="closeAddTaskModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" id="btn-save-task">Save Task</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/utils.js"></script>
  <script>
    let membersList = [];
    
    const statuses = [
      { id: 'todo', label: 'To Do' },
      { id: 'in_progress', label: 'In Progress' },
      { id: 'done', label: 'Done' },
      { id: 'blocked', label: 'Blocked' }
    ];

    async function initTasks() {
      try {
        membersList = await API.getMembers().catch(() => []);
        loadTasks();
      } catch(err) {
        showToast('Error initializing task board', 'error');
      }
    }

    async function loadTasks() {
      const board = document.getElementById('kanban-board');
      try {
        const tasks = await API.getTasks();
        
        board.innerHTML = statuses.map(status => {
          const colTasks = tasks.filter(t => t.status === status.id);
          return `
            <div class="kanban-column">
              <div class="kanban-header">
                <span>${status.label}</span>
                <span class="badge badge-gray">${colTasks.length}</span>
              </div>
              <div class="kanban-cards">
                ${colTasks.map(t => renderTaskCard(t)).join('')}
                ${colTasks.length === 0 ? '<div style="color:var(--text-muted); text-align:center; padding:2rem 1rem; font-size:0.85rem; font-style:italic;">No tasks here</div>' : ''}
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        showToast('Failed to load tasks', 'error');
      }
    }

    function renderTaskCard(task) {
      const assignedMember = membersList.find(m => m.id === task.assigned_to);
      
      const memberOpts = `<option value="">Unassigned</option>` + 
        membersList.map(m => `<option value="${m.id}" ${m.id === task.assigned_to ? 'selected' : ''}>${m.name}</option>`).join('');

      const statusOpts = statuses.map(s => `<option value="${s.id}" ${s.id === task.status ? 'selected' : ''}>${s.label}</option>`).join('');

      return `
        <div class="task-card">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.5rem;">
            ${priorityBadge(task.priority)}
            <button class="btn btn-danger" style="padding:0.15rem 0.45rem; font-size:0.7rem; line-height:1;" onclick="deleteTask('${task.id}')" title="Delete task">✕</button>
          </div>
          <h4>${task.title}</h4>
          ${task.description ? `<p title="${task.description}">${task.description}</p>` : ''}
          
          ${task.assigned_reason ? `<div style="font-size:0.75rem; color:var(--info); margin-bottom:0.6rem; background:rgba(59,130,246,0.1); border-left:3px solid var(--info); padding:0.4rem 0.5rem; border-radius:3px;">💡 <strong>AI Fit:</strong> ${task.assigned_reason}</div>` : ''}
          
          <div class="task-footer">
            <div style="width: 48%;">
              <label class="form-label" style="font-size:0.7rem; margin-bottom:0.2rem;">Status</label>
              <select class="form-control" style="padding:0.25rem 0.4rem; font-size:0.75rem;" onchange="updateStatus('${task.id}', this.value)">
                ${statusOpts}
              </select>
            </div>
            <div style="width: 48%;">
              <label class="form-label" style="font-size:0.7rem; margin-bottom:0.2rem;">Assignee</label>
              <select class="form-control" style="padding:0.25rem 0.4rem; font-size:0.75rem;" onchange="assignTask('${task.id}', this.value)">
                ${memberOpts}
              </select>
            </div>
          </div>
        </div>
      `;
    }

    async function uploadCSV(e) {
      const file = e.target.files[0];
      if (!file) return;
      const fd = new FormData();
      fd.append('file', file);
      try {
        const res = await API.uploadTasksCSV(fd);
        showToast(`Imported ${res.added || 'new'} tasks from CSV!`, 'success');
        loadTasks();
      } catch (err) {
        showToast(err.message, 'error');
      }
      e.target.value = '';
    }

    function openAddTaskModal() { document.getElementById('add-task-modal').classList.add('active'); }
    function closeAddTaskModal() { document.getElementById('add-task-modal').classList.remove('active'); }

    async function handleAddTask(e) {
      e.preventDefault();
      const form = e.target;
      const data = Object.fromEntries(new FormData(form).entries());
      const btn = document.getElementById('btn-save-task');
      
      setLoading(btn, true);
      try {
        await API.createTask(data);
        showToast('Task created!', 'success');
        closeAddTaskModal();
        form.reset();
        loadTasks();
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        setLoading(btn, false, 'Save Task');
      }
    }

    async function updateStatus(id, status) {
      try {
        await API.updateTaskStatus(id, status);
        loadTasks();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    async function assignTask(id, member_id) {
      try {
        await API.assignTask(id, member_id || null);
        loadTasks();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    async function deleteTask(id) {
      if(!confirm('Delete this task?')) return;
      try {
        await API.deleteTask(id);
        showToast('Task removed', 'success');
        loadTasks();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    async function clearAllTasks() {
      if(!confirm('Clear ALL tasks from the board?')) return;
      try {
        await API.clearTasks();
        showToast('All tasks cleared', 'info');
        loadTasks();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    async function aiAssign(btn) {
      setLoading(btn, true);
      try {
        const res = await API.aiAssign();
        showToast(res.message || 'AI Assignment complete!', 'success');
        loadTasks();
      } catch (err) {
        showToast(err.message || 'AI assignment failed', 'error');
      } finally {
        setLoading(btn, false, '🤖 AI Assign All');
      }
    }

    async function aiPrioritize(btn) {
      setLoading(btn, true);
      try {
        const res = await API.aiPrioritize();
        showToast(`AI prioritized ${res.updated || 0} tasks!`, 'success');
        loadTasks();
      } catch (err) {
        showToast(err.message || 'AI prioritization failed', 'error');
      } finally {
        setLoading(btn, false, '📊 AI Prioritize');
      }
    }

    window.onload = initTasks;
  </script>
</body>
</html>
